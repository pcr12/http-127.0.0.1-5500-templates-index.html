<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ӘҚК Әскери институты — локальный чат</title>
  <style>
    :root {
      --navy-950: #071330;
      --navy-900: #0a1a40;
      --navy-800: #0f2556;
      --navy-700: #16326e;
      --sky-300: #a9c2f2;
      --sky-200: #c8d7f5;
      --gold-400: #f6c431;
      --danger-400: #ff7a7a;
      --danger-500: #e5484d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--navy-950);
      font-family: "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* ---------- Левая панель с брендингом ---------- */
    .brand-panel {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      width: 100%;
      max-width: 480px;
      padding: 48px 32px 24px;
      color: var(--sky-200);
      background:
        radial-gradient(120% 60% at 50% 0%, var(--navy-700) 0%, transparent 70%),
        radial-gradient(90% 30% at 50% 100%, rgba(52, 96, 190, .28) 0%, transparent 75%),
        linear-gradient(180deg, var(--navy-800) 0%, var(--navy-900) 55%, var(--navy-950) 100%);
    }

    /* Орнамент «қошқар мүйіз»: сетка по центру панели, плавно гаснет к низу */
    .brand-panel__ornament {
      position: absolute;
      top: 0;
      left: 50%;
      z-index: -1;
      width: 1200px;
      height: 100%;
      transform: translateX(-50%);
      pointer-events: none;
      -webkit-mask-image: linear-gradient(180deg, #000 0%, rgba(0, 0, 0, .7) 30%, rgba(0, 0, 0, .25) 60%, transparent 85%);
              mask-image: linear-gradient(180deg, #000 0%, rgba(0, 0, 0, .7) 30%, rgba(0, 0, 0, .25) 60%, transparent 85%);
    }
    .brand-panel__ornament .km {
      fill: none;
      stroke: #6f8fd0;
      stroke-opacity: .2;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .brand-panel__ornament .km .o-fill { fill: #6f8fd0; fill-opacity: .2; stroke: none; }

    .brand-panel__content { position: relative; z-index: 1; }

    .brand-panel__emblem {
      display: block;
      width: 112px;
      height: auto;
      margin: 0 0 28px;
      filter: drop-shadow(0 6px 18px rgba(0, 0, 0, .45));
    }

    .brand-panel__title {
      margin: 0;
      color: var(--gold-400);
      font-size: 30px;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: .01em;
      text-transform: uppercase;
    }

    .brand-panel__subtitle {
      margin: 10px 0 0;
      color: var(--sky-300);
      font-size: 13px;
      line-height: 1.55;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    /* Небольшой орнаментальный разделитель */
    .brand-panel__divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 22px 0;
      color: var(--gold-400);
    }
    .brand-panel__divider::before,
    .brand-panel__divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(246, 196, 49, .55), transparent);
    }
    .brand-panel__divider svg {
      width: 30px;
      height: 30px;
      fill: none;
      stroke: currentColor;
      stroke-width: 7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .brand-panel__divider svg .o-fill { fill: currentColor; stroke: none; }

    .brand-panel__text {
      margin: 0;
      color: #d3ddf3;
      font-size: 15px;
      line-height: 1.6;
    }

    .brand-panel__warning {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 24px;
      padding: 14px 16px;
      border: 1px solid rgba(255, 122, 122, .45);
      border-radius: 14px;
      background: rgba(110, 18, 38, .45);
      backdrop-filter: blur(2px);
      color: var(--danger-400);
      font-size: 13px;
      font-weight: 800;
      line-height: 1.35;
      text-transform: uppercase;
    }
    .brand-panel__warning strong { color: #fff; }
    .brand-panel__warning-icon {
      flex: none;
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--danger-500);
      box-shadow: 0 0 0 4px rgba(229, 72, 77, .18);
    }
    .brand-panel__warning-icon svg { width: 16px; height: 16px; fill: #fff; }

    /* Беркут: целиком, внизу панели, не перекрывает текст */
    .brand-panel__eagle {
      display: block;
      width: 100%;
      max-width: 420px;
      height: auto;
      margin: 0 auto;
      opacity: .4;
      pointer-events: none;
    }
    .brand-panel__footer-space { flex: 1 1 auto; min-height: 28px; }
    .brand-panel__eagle .fe {
      fill: url(#eagle-fill);
      stroke: var(--navy-950);
      stroke-width: 2.5;
      stroke-linejoin: round;
    }
    .brand-panel__eagle .ln {
      fill: none;
      stroke: var(--navy-950);
      stroke-width: 2;
      stroke-linecap: round;
    }
    .brand-panel__eagle .eye { fill: var(--navy-950); }

    @media (max-width: 420px) {
      .brand-panel { padding: 36px 20px 20px; }
      .brand-panel__title { font-size: 26px; }
    }
  </style>
</head>

    <div class="brand-panel__content">
      <!-- Подставьте путь к своей эмблеме -->
      <img class="brand-panel__emblem" src="../static/img/emblem.png" alt="Эмблема института">

      <h1 class="brand-panel__title">ӘҚК Әскери<br>институты</h1>
      <p class="brand-panel__subtitle">
        Екі мәрте Кеңес Одағының Батыры<br>
        Т. Ж. Бегельдинов атындағы
      </p>

      <div class="brand-panel__divider" aria-hidden="true">
        <svg viewBox="-60 -54 120 122"><use href="#km-motif"/></svg>
      </div>

      <p class="brand-panel__text">
